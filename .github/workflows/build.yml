name: build-and-publish
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: yorkane/llm-router

permissions:
  contents: read
  packages: write

jobs:
  binary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev cmake pkg-config protobuf-compiler libprotobuf-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway
      - name: "Build smg (ci profile: thin LTO, fast)"
        run: cargo build --profile ci --bin smg
        working-directory: gateway
      - uses: actions/upload-artifact@v4
        with:
          name: smg
          path: gateway/target/ci/smg

  image:
    needs: binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smg
          path: artifact
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BIN=artifact/smg
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
